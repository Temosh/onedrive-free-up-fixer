name: Release

# Push a tag like v1.0.0 to build the app and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="OneDrive-Free-Up-Fixer-${VERSION}.zip"
          ditto -c -k --keepParent "build/OneDrive Free Up Fixer.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "OneDrive Free Up Fixer ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
